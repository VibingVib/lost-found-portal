<!DOCTYPE html>
<html>

<head>

<title>My Items</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>

<div class="container mt-5">

<h1>My Uploaded Items</h1>

<a href="/" class="btn btn-secondary mb-3">Back</a>

<table class="table table-striped">

<tr>

<th>ID</th>
<th>Image</th>
<th>Item</th>
<th>Description</th>

</tr>

{% for item in items %}

<tr>

<td>{{item.id}}</td>

<td>
<img src="{{ url_for('static', filename='uploads/' + item.image) }}" width="80">
</td>

<td>{{item.item}}</td>

<td>{{item.desc}}</td>

</tr>

{% endfor %}

</table>

</div>

</body>

</html>
